name: Build and Push Docker Image 

on: 
  push:
    branches:
      - main   
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - name: checkout code 
        uses: actions/checkout@v4

      - name: set up jdk 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: cache maven
        uses: actions/cache@v3
        with:
          path: ~/.n2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }} 
          restore-keys: |
            ${{ runner.os }}-m2

      - name: build and test
        run: mvn clean verify

      - name: upload jacoco 
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
  build: 
    runs-on: ubuntu-latest
    needs : test
    steps: 
      - name:  checkout code
        uses: actions/checkout@v4

      - name: set up jdk 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: package application 
        run: mvn clean package -DskipTests

      - name: upload jar 
        uses: actions/upload-artifact@v4
        with: 
          name: app-jar
          path: target/*.jar